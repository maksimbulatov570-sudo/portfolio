<script>
var isMob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.innerWidth<768;

var INFO={
  ga:{title:'GOLD APPLE',theme:'dk',logo:'logos/ga-logo.png',desc:'<strong>Разработка Key Visual,</strong> ресайзы, перевод, подготовка к печати.<br><br>Совместный проект со Studio21. Обратились перед новым годом с очень сжатыми сроками. Успели доработать концепцию, собрать, сделать ресайзы и адаптировать под другой язык с соблюдением всех особенностей <strong>за 3 недели.</strong>',imgs:13,vids:[]},
  pan:{title:'PANAGERO',theme:'dk',logo:'logos/pan-logo.png',desc:'<strong>Разработал визуальный язык бренда,</strong> сделал новые шаблоны по которым было сверстано 130 единиц контента для соц сетей.<br><br>Также занимался разработкой креативов для рассылок email, визуалом сайта.<br><br>И генерацией AI креативов.',imgs:17,vids:['videos/video-02.mp4']},
  lp:{title:'LE PAPA',theme:'dk',logo:'logos/lp-logo.png',desc:'<strong>AI креативы для соц сетей.</strong><br><br>Генерация изображений, стилизация, финальная доработка.',imgs:4,vids:['videos/video-03.mp4']},
  treaf:{title:'TREAF',theme:'dk',logo:'logos/treaf-logo.png',desc:'<strong>Доработал визуальный язык бренда,</strong> помог пересобрать контент и адаптировал старые съемки под новый стиль.',imgs:4,vids:['videos/video-04.mp4']},
  cb:{title:'CUVEE BACCINI',theme:'dk',logo:'logos/cb-logo.png',desc:'<strong>Разработал логотип и этикетки</strong> ребятам из Шампани, Франция.<br>Бутылки уже стоят на полках в магазинах.',imgs:3,vids:[]},
  bp:{title:'BULATOV.POSTER',theme:'lt',logo:'logos/bp-logo.png',desc:'<strong>Авторский постерный проект.</strong><br><br>Визуальные эксперименты, типографика, коллажи.',imgs:12,vids:['videos/video-05.mp4']},
  endy:{title:'ENDY',theme:'dk',logo:'logos/endy-logo.png',desc:'Работал в <strong>4-ом в России брендинговом агентстве ENDY.</strong><br><br>NDA - показать все не могу, но умею работать в больших командах с серьезными клиентами.',imgs:11,vids:[]}
};

var KEYS=['ga','pan','lp','treaf','cb','bp','endy'];
function ip(key,i){return 'img/'+key+'-'+(i<10?'0'+i:i)+'.jpg';}

var DATA=[];
KEYS.forEach(function(key){
  var info=INFO[key];
  for(var i=1;i<=info.imgs;i++){
    var big=(i===1);
    var w=big?260:(130+Math.round(Math.random()*70));
    DATA.push({src:ip(key,i),type:'img',project:key,label:info.title,w:w,h:Math.round(w*1.3)});
  }
  info.vids.forEach(function(v){
    DATA.push({src:v,type:'video',project:key,label:info.title,w:170,h:300});
  });
});

var world=document.getElementById('world');
var canvas=document.getElementById('canvas');
var cur=document.getElementById('cursor');
var clabel=document.getElementById('clabel');
var detail=document.getElementById('detail');
var dHero=document.getElementById('dHero');
var dGal=document.getElementById('dGal');
var dCloseBtn=document.getElementById('dClose');
var lightbox=document.getElementById('lightbox');
var lbImg=document.getElementById('lbImg');
var lbCloseBtn=document.getElementById('lbClose');
var loadingEl=document.getElementById('loading');
var loadFill=document.getElementById('loadFill');

var cards=[];
var zTop=100;
var zoom=1;
var dragC=null;
var dragOff={x:0,y:0};
var dragVel={x:0,y:0};
var dragTime=0;
var gravOn=false;
var actx=null;

function snd(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    var b=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate);
    var d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.012));
    var s=actx.createBufferSource();s.buffer=b;
    var g=actx.createGain();g.gain.value=0.02;
    s.connect(g);g.connect(actx.destination);s.start();
  }catch(e){}
}

function build(){
  world.innerHTML='';cards=[];
  var W=window.innerWidth,H=window.innerHeight;
  var pad=isMob?70:130,sc=isMob?0.55:1;
  DATA.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='card';
    el.setAttribute('data-project',d.project);
    el.setAttribute('data-idx',i);
    var w=Math.round(d.w*sc);
    var x=pad+Math.random()*Math.max(10,W-w-pad*2);
    var y=pad+Math.random()*Math.max(10,H-200-pad*2);
    var r=(Math.random()-0.5)*18;
    el.style.width=w+'px';
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.transform='rotate('+r+'deg)';
    el.style.zIndex=10+i;
    if(d.type==='video'){
      el.style.height=Math.round(300*sc)+'px';
      var v=document.createElement('video');
      v.src=d.src;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;
      v.setAttribute('playsinline','');el.appendChild(v);
    }else{
      var img=document.createElement('img');
      img.src=d.src;img.alt=d.label;img.loading='lazy';el.appendChild(img);
    }
    var tg=document.createElement('div');
    tg.className='tg';tg.textContent=d.label;el.appendChild(tg);
    world.appendChild(el);
    var co={el:el,x:x,y:y,w:w,h:Math.round(w*1.3),r:r,vx:0,vy:0,project:d.project,data:d};
    cards.push(co);
    if(d.type==='img'){
      (function(c){
        var im=c.el.querySelector('img');
        if(im)im.onload=function(){
          var rect=c.el.getBoundingClientRect();
          if(rect.height>0)c.h=rect.height;
        };
      })(co);
    }
  });
}

/* CURSOR — плавное следование */
var mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
function curTick(){
  cx+=(mx-cx)*0.18;cy+=(my-cy)*0.18;
  cur.style.left=cx+'px';cur.style.top=cy+'px';
  clabel.style.left=cx+'px';clabel.style.top=cy+'px';
  requestAnimationFrame(curTick);
}
curTick();

canvas.addEventListener('mouseover',function(e){
  var c=e.target.closest('.card');
  if(c){cur.classList.add('hover');clabel.textContent=DATA[c.getAttribute('data-idx')].label;clabel.classList.add('on');}
  else{cur.classList.remove('hover');clabel.classList.remove('on');}
});
canvas.addEventListener('mouseout',function(e){
  if(!e.target.closest('.card')){cur.classList.remove('hover');clabel.classList.remove('on');}
});

/* DRAG */
canvas.addEventListener('mousedown',function(e){
  var t=e.target.closest('.card');if(!t)return;e.preventDefault();
  var c=cards[t.getAttribute('data-idx')];dragC=c;
  c.el.classList.add('dr');cur.classList.add('drag');
  zTop++;c.el.style.zIndex=zTop;
  var rect=c.el.getBoundingClientRect();
  dragOff.x=e.clientX-rect.left;dragOff.y=e.clientY-rect.top;
  dragVel.x=0;dragVel.y=0;dragTime=Date.now();snd();
});
document.addEventListener('mousemove',function(e){
  if(!dragC)return;var now=Date.now(),dt=now-dragTime;
  var nx=(e.clientX-dragOff.x)/zoom,ny=(e.clientY-dragOff.y)/zoom;
  if(dt>0){dragVel.x=(nx-dragC.x)/dt*16;dragVel.y=(ny-dragC.y)/dt*16;}
  dragC.x=nx;dragC.y=ny;
  dragC.el.style.left=nx+'px';dragC.el.style.top=ny+'px';dragTime=now;
});
document.addEventListener('mouseup',function(){
  if(!dragC)return;dragC.el.classList.remove('dr');cur.classList.remove('drag');
  dragC.vx=dragVel.x;dragC.vy=dragVel.y;dragC=null;snd();
});

/* PHYSICS */
function tick(){
  var W=window.innerWidth/zoom,H=window.innerHeight/zoom;
  for(var i=0;i<cards.length;i++){
    var c=cards[i];if(c===dragC||c.el.style.display==='none')continue;
    if(gravOn)c.vy+=0.6;
    if(Math.abs(c.vx)>0.08||Math.abs(c.vy)>0.08){
      c.x+=c.vx;c.y+=c.vy;c.vx*=0.94;c.vy*=0.94;
      if(c.x<0){c.x=0;c.vx=-c.vx*0.5;}
      if(c.x+c.w>W){c.x=W-c.w;c.vx=-c.vx*0.5;}
      if(c.y<0){c.y=0;c.vy=-c.vy*0.5;}
      if(c.y+c.h>H){c.y=H-c.h;c.vy=-c.vy*0.5;}
      c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';
    }else{c.vx=0;c.vy=0;}
  }
  for(var i=0;i<cards.length;i++){
    var a=cards[i];if(a===dragC||a.el.style.display==='none')continue;
    for(var j=i+1;j<cards.length;j++){
      var b=cards[j];if(b===dragC||b.el.style.display==='none')continue;
      var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2;
      var ox=(a.w+b.w)/2-Math.abs(acx-bcx),oy=(a.h+b.h)/2-Math.abs(acy-bcy);
      if(ox>0&&oy>0){
        if(ox<oy){var s=acx<bcx?-1:1;a.vx+=s*0.25;b.vx-=s*0.25;}
        else{var s=acy<bcy?-1:1;a.vy+=s*0.25;b.vy-=s*0.25;}
      }
    }
  }
  requestAnimationFrame(tick);
}
tick();

/* DBLCLICK → DETAIL */
canvas.addEventListener('dblclick',function(e){
  var t=e.target.closest('.card');if(!t)return;
  openDetail(t.getAttribute('data-project'));
});

function openDetail(key){
  var info=INFO[key];if(!info)return;
  detail.className='open '+info.theme;
  dHero.innerHTML='<img class="dlogo" src="'+info.logo+'" alt="'+info.title+'" onerror="this.style.display=\'none\'">'
    +'<h1 class="dtitle">'+info.title+'</h1>'
    +'<div class="ddesc">'+info.desc+'</div>';
  var html='';
  info.vids.forEach(function(v){
    html+='<div class="gi"><video src="'+v+'" autoplay muted loop playsinline controls style="width:100%;display:block"></video></div>';
  });
  for(var i=1;i<=info.imgs;i++){
    html+='<div class="gi"><img src="'+ip(key,i)+'" alt="'+info.title+'" loading="lazy"></div>';
  }
  dGal.innerHTML=html;
  var imgs=dGal.querySelectorAll('img');
  for(var i=0;i<imgs.length;i++){
    imgs[i].addEventListener('click',function(){
      lbImg.src=this.src;lbImg.style.display='block';
      lightbox.classList.add('open');
    });
  }
  detail.scrollTop=0;snd();
}

/* DETAIL CLOSE — плавно */
dCloseBtn.addEventListener('click',closeDetail);
function closeDetail(){
  detail.style.transition='opacity .35s ease,transform .35s ease';
  detail.style.opacity='0';
  detail.style.transform='translateY(20px)';
  setTimeout(function(){
    detail.className='';
    detail.style.transition='';
    detail.style.opacity='';
    detail.style.transform='';
    var vids=dGal.querySelectorAll('video');
    for(var i=0;i<vids.length;i++)vids[i].pause();
  },350);
}

/* LIGHTBOX CLOSE — плавно */
lbCloseBtn.addEventListener('click',closeLB);
lightbox.addEventListener('click',function(e){if(e.target===lightbox)closeLB();});
function closeLB(){
  lightbox.style.transition='opacity .3s ease';
  lightbox.style.opacity='0';
  setTimeout(function(){
    lightbox.classList.remove('open');
    lightbox.style.transition='';
    lightbox.style.opacity='';
    lbImg.style.display='none';
  },300);
}

/* ZOOM — плавнее */
var targetZoom=1;
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  var d=e.deltaY>0?-0.05:0.05;
  targetZoom=Math.min(2.5,Math.max(0.3,targetZoom+d));
},{passive:false});

function zoomTick(){
  zoom+=(targetZoom-zoom)*0.12;
  world.style.transform='scale('+zoom+')';
  requestAnimationFrame(zoomTick);
}
zoomTick();

/* KEYBOARD */
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!detail.classList.contains('open')){
    e.preventDefault();gravOn=!gravOn;
    if(gravOn){snd();cards.forEach(function(c){c.vx+=(Math.random()-0.5)*4;c.vy+=Math.random()*3;});}
  }
  if(e.code==='Escape'){
    if(lightbox.classList.contains('open'))closeLB();
    else if(detail.classList.contains('open'))closeDetail();
    gravOn=false;
  }
});

/* SHAKE DETECT */
var shPts=[],lastShake=0;
document.addEventListener('mousemove',function(e){
  var now=Date.now();
  shPts.push({x:e.clientX,y:e.clientY,t:now});
  while(shPts.length>0&&now-shPts[0].t>500)shPts.shift();
  if(shPts.length<6||now-lastShake<1200)return;
  var dist=0,dirs=0;
  for(var i=1;i<shPts.length;i++){
    var dx=shPts[i].x-shPts[i-1].x,dy=shPts[i].y-shPts[i-1].y;
    dist+=Math.sqrt(dx*dx+dy*dy);
    if(i>1){var px=shPts[i-1].x-shPts[i-2].x;if((dx>0&&px<0)||(dx<0&&px>0))dirs++;}
  }
  if(dist>400&&dirs>=3){lastShake=now;scatter();}
});

function scatter(){
  snd();gravOn=false;
  var W=window.innerWidth,H=window.innerHeight,pad=isMob?70:130;
  cards.forEach(function(c){
    if(c.el.style.display==='none')return;
    var nx=pad+Math.random()*Math.max(10,W-c.w-pad*2);
    var ny=pad+Math.random()*Math.max(10,H-c.h-pad*2);
    var nr=(Math.random()-0.5)*22;
    c.x=nx;c.y=ny;c.r=nr;c.vx=0;c.vy=0;
    c.el.style.transition='left .7s cubic-bezier(.22,1,.36,1),top .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)';
    c.el.style.left=nx+'px';c.el.style.top=ny+'px';
    c.el.style.transform='rotate('+nr+'deg)';
    setTimeout(function(){c.el.style.transition='';},750);
  });
  setTimeout(snd,350);
}

/* TABS */
var tabs=document.querySelectorAll('.tb');
for(var t=0;t<tabs.length;t++){
  tabs[t].addEventListener('click',function(){
    var f=this.getAttribute('data-f');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('on');
    this.classList.add('on');
    snd();
    if(f==='all'){
      document.body.classList.remove('light-mode');
      cards.forEach(function(c){
        c.el.style.display='block';
        c.el.style.transition='opacity .4s ease';
        c.el.style.opacity='1';
        setTimeout(function(){c.el.style.transition='';},400);
      });
      scatter();return;
    }
    if(f==='bp')document.body.classList.add('light-mode');
    else document.body.classList.remove('light-mode');
    var match=[],rest=[];
    cards.forEach(function(c){if(c.project===f)match.push(c);else rest.push(c);});
    rest.forEach(function(c){
      c.el.style.transition='opacity .4s ease,transform .4s ease';
      c.el.style.opacity='0';
      c.el.style.transform='scale(.95) rotate('+c.r+'deg)';
      setTimeout(function(){c.el.style.display='none';c.el.style.transition='';},400);
    });
    var W=window.innerWidth,H=window.innerHeight;
    var cols=Math.ceil(Math.sqrt(match.length*1.3)),gap=isMob?8:14;
    var avgW=0,avgH=0;
    match.forEach(function(c){avgW+=c.w;avgH+=c.h;});
    avgW=avgW/match.length;avgH=avgH/match.length;
    var startX=Math.max(20,(W-cols*(avgW+gap))/2);
    var startY=Math.max(120,(H-Math.ceil(match.length/cols)*(avgH+gap))/2);
    match.forEach(function(c,i){
      var col=i%cols,row=Math.floor(i/cols);
      var nx=startX+col*(avgW+gap)+(Math.random()-0.5)*6;
      var ny=startY+row*(avgH+gap)+(Math.random()-0.5)*6;
      var nr=(Math.random()-0.5)*4;
      c.el.style.display='block';
      c.el.style.transition='left .6s cubic-bezier(.22,1,.36,1),top .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),opacity .4s ease';
      c.el.style.opacity='1';c.el.style.left=nx+'px';c.el.style.top=ny+'px';
      c.el.style.transform='rotate('+nr+'deg)';
      c.x=nx;c.y=ny;c.r=nr;c.vx=0;c.vy=0;
      zTop++;c.el.style.zIndex=zTop;
      setTimeout(function(){c.el.style.transition='';},700);
    });
  });
  tabs[t].addEventListener('dblclick',function(){
    var f=this.getAttribute('data-f');if(f!=='all')openDetail(f);
  });
}

/* TOUCH — DRAG */
var tCard=null,tOff={x:0,y:0},tLast=0,lastTap=0;
canvas.addEventListener('touchstart',function(e){
  if(e.touches.length>1)return;
  var touch=e.touches[0];
  var el=document.elementFromPoint(touch.clientX,touch.clientY);
  var card=el?el.closest('.card'):null;
  if(!card)return;
  var now=Date.now();
  if(now-lastTap<300){openDetail(card.getAttribute('data-project'));lastTap=0;e.preventDefault();return;}
  lastTap=now;
  tCard=cards[card.getAttribute('data-idx')];
  var rect=card.getBoundingClientRect();
  tOff.x=touch.clientX-rect.left;tOff.y=touch.clientY-rect.top;
  tLast=now;zTop++;tCard.el.style.zIndex=zTop;
  tCard.el.classList.add('dr');snd();e.preventDefault();
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  if(!tCard||e.touches.length>1)return;
  var touch=e.touches[0],now=Date.now(),dt=now-tLast;
  var nx=(touch.clientX-tOff.x)/zoom,ny=(touch.clientY-tOff.y)/zoom;
  if(dt>0){tCard.vx=(nx-tCard.x)/dt*16;tCard.vy=(ny-tCard.y)/dt*16;}
  tCard.x=nx;tCard.y=ny;
  tCard.el.style.left=nx+'px';tCard.el.style.top=ny+'px';
  tLast=now;e.preventDefault();
},{passive:false});

canvas.addEventListener('touchend',function(){
  if(!tCard)return;tCard.el.classList.remove('dr');tCard=null;snd();
});

/* TOUCH — PINCH ZOOM */
var pinchD=0;
canvas.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchD=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(pinchD>0){targetZoom=Math.min(2.5,Math.max(0.3,targetZoom*(d/pinchD)));}
    pinchD=d;
  }
},{passive:true});
canvas.addEventListener('touchend',function(e){if(e.touches.length<2)pinchD=0;},{passive:true});

/* DEVICE SHAKE */
if(isMob&&window.DeviceMotionEvent){
  var shLast=0;
  window.addEventListener('devicemotion',function(e){
    var a=e.accelerationIncludingGravity;if(!a)return;
    var f=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
    var now=Date.now();
    if(f>30&&now-shLast>1500){shLast=now;scatter();}
  });
}

/* LOADING — логотип заполняется снизу вверх */
var loadProg=0;
var loadInt=setInterval(function(){
  loadProg+=Math.random()*20+5;
  if(loadProg>100)loadProg=100;
  var top=100-loadProg;
  loadFill.style.clipPath='inset('+top+'% 0 0 0)';
  loadFill.style.webkitClipPath='inset('+top+'% 0 0 0)';
  if(loadProg>=100){
    clearInterval(loadInt);
    setTimeout(function(){
      loadingEl.classList.add('done');
      setTimeout(function(){loadingEl.style.display='none';},800);
    },400);
  }
},250);

/* BUILD */
build();
setTimeout(scatter,1200);

var rTimer;
window.addEventListener('resize',function(){
  clearTimeout(rTimer);
  rTimer=setTimeout(function(){build();setTimeout(scatter,100);},300);
});
</script>
</body>
</html><script>

var INFO={
  ga:{title:'GOLD APPLE',theme:'dk',logo:'logos/ga-logo.png',desc:'<strong>Разработка Key Visual,</strong> ресайзы, перевод, подготовка к печати.<br><br>Совместный проект со Studio21. Обратились перед новым годом с очень сжатыми сроками. Успели доработать концепцию, собрать, сделать ресайзы и адаптировать под другой язык с соблюдением всех особенностей <strong>за 3 недели.</strong>',imgs:13,vids:[]},
  pan:{title:'PANAGERO',theme:'dk',logo:'logos/pan-logo.png',desc:'<strong>Разработал визуальный язык бренда,</strong> сделал новые шаблоны по которым было сверстано 130 единиц контента для соц сетей.<br><br>Также занимался разработкой креативов для рассылок email, визуалом сайта.<br><br>И генерацией AI креативов.',imgs:17,vids:['videos/video-02.mp4']},
  lp:{title:'LE PAPA',theme:'dk',logo:'logos/lp-logo.png',desc:'<strong>AI креативы для соц сетей.</strong><br><br>Генерация изображений, стилизация, финальная доработка.',imgs:4,vids:['videos/video-03.mp4']},
  treaf:{title:'TREAF',theme:'dk',logo:'logos/treaf-logo.png',desc:'<strong>Доработал визуальный язык бренда,</strong> помог пересобрать контент и адаптировал старые съемки под новый стиль.',imgs:4,vids:['videos/video-04.mp4']},
  cb:{title:'CUVEE BACCINI',theme:'dk',logo:'logos/cb-logo.png',desc:'<strong>Разработал логотип и этикетки</strong> ребятам из Шампани, Франция.<br>Бутылки уже стоят на полках в магазинах.',imgs:3,vids:[]},
  bp:{title:'BULATOV.POSTER',theme:'lt',logo:'logos/bp-logo.png',desc:'<strong>Авторский постерный проект.</strong><br><br>Визуальные эксперименты, типографика, коллажи.',imgs:12,vids:['videos/video-05.mp4']},
  endy:{title:'ENDY',theme:'dk',logo:'logos/endy-logo.png',desc:'Работал в <strong>4-ом в России брендинговом агентстве ENDY.</strong><br><br>NDA - показать все не могу, но умею работать в больших командах с серьезными клиентами.',imgs:11,vids:[]}
};

var KEYS=['ga','pan','lp','treaf','cb','bp','endy'];
function ip(key,i){return 'img/'+key+'-'+(i<10?'0'+i:i)+'.jpg';}

var DATA=[];
KEYS.forEach(function(key){
  var info=INFO[key];
  for(var i=1;i<=info.imgs;i++){
    var big=(i===1);
    var w=big?260:(130+Math.round(Math.random()*70));
    DATA.push({src:ip(key,i),type:'img',project:key,label:info.title,w:w,h:Math.round(w*1.3)});
  }
  info.vids.forEach(function(v){
    DATA.push({src:v,type:'video',project:key,label:info.title,w:170,h:300});
  });
});

var world=document.getElementById('world');
var canvas=document.getElementById('canvas');
var cur=document.getElementById('cursor');
var clabel=document.getElementById('clabel');
var detail=document.getElementById('detail');
var dHero=document.getElementById('dHero');
var dGal=document.getElementById('dGal');
var dCloseBtn=document.getElementById('dClose');
var lightbox=document.getElementById('lightbox');
var lbImg=document.getElementById('lbImg');
var lbCloseBtn=document.getElementById('lbClose');
var loadingEl=document.getElementById('loading');

var cards=[];
var zTop=100;
var zoom=1;
var dragC=null;
var dragOff={x:0,y:0};
var dragVel={x:0,y:0};
var dragTime=0;
var gravOn=false;
var actx=null;

function snd(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    var b=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate);
    var d=b.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.012));
    var s=actx.createBufferSource();s.buffer=b;
    var g=actx.createGain();g.gain.value=0.02;
    s.connect(g);g.connect(actx.destination);s.start();
  }catch(e){}
}

function build(){
  world.innerHTML='';cards=[];
  var W=window.innerWidth,H=window.innerHeight;
  var pad=isMob?70:130,sc=isMob?0.55:1;
  DATA.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='card';
    el.setAttribute('data-project',d.project);
    el.setAttribute('data-idx',i);
    var w=Math.round(d.w*sc);
    var x=pad+Math.random()*Math.max(10,W-w-pad*2);
    var y=pad+Math.random()*Math.max(10,H-200-pad*2);
    var r=(Math.random()-0.5)*18;
    el.style.width=w+'px';
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.transform='rotate('+r+'deg)';
    el.style.zIndex=10+i;
    if(d.type==='video'){
      el.style.height=Math.round(300*sc)+'px';
      var v=document.createElement('video');
      v.src=d.src;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;
      v.setAttribute('playsinline','');el.appendChild(v);
    }else{
      var img=document.createElement('img');
      img.src=d.src;img.alt=d.label;img.loading='lazy';el.appendChild(img);
    }
    var tg=document.createElement('div');
    tg.className='tg';tg.textContent=d.label;el.appendChild(tg);
    world.appendChild(el);
    var co={el:el,x:x,y:y,w:w,h:Math.round(w*1.3),r:r,vx:0,vy:0,project:d.project,data:d};
    cards.push(co);
    if(d.type==='img'){
      (function(c){
        var im=c.el.querySelector('img');
        if(im)im.onload=function(){
          var rect=c.el.getBoundingClientRect();
          if(rect.height>0)c.h=rect.height;
        };
      })(co);
    }
  });
}

/* CURSOR — плавное следование */
var mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
function curTick(){
  cx+=(mx-cx)*0.18;cy+=(my-cy)*0.18;
  cur.style.left=cx+'px';cur.style.top=cy+'px';
  clabel.style.left=cx+'px';clabel.style.top=cy+'px';
  requestAnimationFrame(curTick);
}
curTick();

canvas.addEventListener('mouseover',function(e){
  var c=e.target.closest('.card');
  if(c){cur.classList.add('hover');clabel.textContent=DATA[c.getAttribute('data-idx')].label;clabel.classList.add('on');}
  else{cur.classList.remove('hover');clabel.classList.remove('on');}
});
canvas.addEventListener('mouseout',function(e){
  if(!e.target.closest('.card')){cur.classList.remove('hover');clabel.classList.remove('on');}
});

/* DRAG */
canvas.addEventListener('mousedown',function(e){
  var t=e.target.closest('.card');if(!t)return;e.preventDefault();
  var c=cards[t.getAttribute('data-idx')];dragC=c;
  c.el.classList.add('dr');cur.classList.add('drag');
  zTop++;c.el.style.zIndex=zTop;
  var rect=c.el.getBoundingClientRect();
  dragOff.x=e.clientX-rect.left;dragOff.y=e.clientY-rect.top;
  dragVel.x=0;dragVel.y=0;dragTime=Date.now();snd();
});
document.addEventListener('mousemove',function(e){
  if(!dragC)return;var now=Date.now(),dt=now-dragTime;
  var nx=(e.clientX-dragOff.x)/zoom,ny=(e.clientY-dragOff.y)/zoom;
  if(dt>0){dragVel.x=(nx-dragC.x)/dt*16;dragVel.y=(ny-dragC.y)/dt*16;}
  dragC.x=nx;dragC.y=ny;
  dragC.el.style.left=nx+'px';dragC.el.style.top=ny+'px';dragTime=now;
});
document.addEventListener('mouseup',function(){
  if(!dragC)return;dragC.el.classList.remove('dr');cur.classList.remove('drag');
  dragC.vx=dragVel.x;dragC.vy=dragVel.y;dragC=null;snd();
});

/* PHYSICS */
function tick(){
  var W=window.innerWidth/zoom,H=window.innerHeight/zoom;
  for(var i=0;i<cards.length;i++){
    var c=cards[i];if(c===dragC||c.el.style.display==='none')continue;
    if(gravOn)c.vy+=0.6;
    if(Math.abs(c.vx)>0.08||Math.abs(c.vy)>0.08){
      c.x+=c.vx;c.y+=c.vy;c.vx*=0.94;c.vy*=0.94;
      if(c.x<0){c.x=0;c.vx=-c.vx*0.5;}
      if(c.x+c.w>W){c.x=W-c.w;c.vx=-c.vx*0.5;}
      if(c.y<0){c.y=0;c.vy=-c.vy*0.5;}
      if(c.y+c.h>H){c.y=H-c.h;c.vy=-c.vy*0.5;}
      c.el.style.left=c.x+'px';c.el.style.top=c.y+'px';
    }else{c.vx=0;c.vy=0;}
  }
  for(var i=0;i<cards.length;i++){
    var a=cards[i];if(a===dragC||a.el.style.display==='none')continue;
    for(var j=i+1;j<cards.length;j++){
      var b=cards[j];if(b===dragC||b.el.style.display==='none')continue;
      var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2;
      var ox=(a.w+b.w)/2-Math.abs(acx-bcx),oy=(a.h+b.h)/2-Math.abs(acy-bcy);
      if(ox>0&&oy>0){
        if(ox<oy){var s=acx<bcx?-1:1;a.vx+=s*0.25;b.vx-=s*0.25;}
        else{var s=acy<bcy?-1:1;a.vy+=s*0.25;b.vy-=s*0.25;}
      }
    }
  }
  requestAnimationFrame(tick);
}
tick();

/* DBLCLICK → DETAIL */
canvas.addEventListener('dblclick',function(e){
  var t=e.target.closest('.card');if(!t)return;
  openDetail(t.getAttribute('data-project'));
});

function openDetail(key){
  var info=INFO[key];if(!info)return;
  detail.className='open '+info.theme;
  dHero.innerHTML='<img class="dlogo" src="'+info.logo+'" alt="'+info.title+'" onerror="this.style.display=\'none\'">'
    +'<h1 class="dtitle">'+info.title+'</h1>'
    +'<div class="ddesc">'+info.desc+'</div>';
  var html='';
  info.vids.forEach(function(v){
    html+='<div class="gi"><video src="'+v+'" autoplay muted loop playsinline controls style="width:100%;display:block"></video></div>';
  });
  for(var i=1;i<=info.imgs;i++){
    html+='<div class="gi"><img src="'+ip(key,i)+'" alt="'+info.title+'" loading="lazy"></div>';
  }
  dGal.innerHTML=html;
  var imgs=dGal.querySelectorAll('img');
  for(var i=0;i<imgs.length;i++){
    imgs[i].addEventListener('click',function(){
      lbImg.src=this.src;lbImg.style.display='block';
      lightbox.classList.add('open');
    });
  }
  detail.scrollTop=0;snd();
}

/* DETAIL CLOSE */
dCloseBtn.addEventListener('click',closeDetail);
function closeDetail(){
  detail.style.transition='opacity .35s ease,transform .35s ease';
  detail.style.opacity='0';
  detail.style.transform='translateY(20px)';
  setTimeout(function(){
    detail.className='';
    detail.style.transition='';detail.style.opacity='';detail.style.transform='';
    var vids=dGal.querySelectorAll('video');
    for(var i=0;i<vids.length;i++)vids[i].pause();
  },350);
}

/* LIGHTBOX CLOSE */
lbCloseBtn.addEventListener('click',closeLB);
lightbox.addEventListener('click',function(e){if(e.target===lightbox)closeLB();});
function closeLB(){
  lightbox.style.transition='opacity .3s ease';
  lightbox.style.opacity='0';
  setTimeout(function(){
    lightbox.classList.remove('open');
    lightbox.style.transition='';lightbox.style.opacity='';
    lbImg.style.display='none';
  },300);
}

/* ZOOM — плавная интерполяция */
var targetZoom=1;
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  var d=e.deltaY>0?-0.05:0.05;
  targetZoom=Math.min(2.5,Math.max(0.3,targetZoom+d));
},{passive:false});
function zoomTick(){
  zoom+=(targetZoom-zoom)*0.12;
  world.style.transform='scale('+zoom+')';
  requestAnimationFrame(zoomTick);
}
zoomTick();

/* KEYBOARD */
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!detail.classList.contains('open')){
    e.preventDefault();gravOn=!gravOn;
    if(gravOn){snd();cards.forEach(function(c){c.vx+=(Math.random()-0.5)*4;c.vy+=Math.random()*3;});}
  }
  if(e.code==='Escape'){
    if(lightbox.classList.contains('open'))closeLB();
    else if(detail.classList.contains('open'))closeDetail();
    gravOn=false;
  }
});

/* SHAKE DETECT */
var shPts=[],lastShake=0;
document.addEventListener('mousemove',function(e){
  var now=Date.now();
  shPts.push({x:e.clientX,y:e.clientY,t:now});
  while(shPts.length>0&&now-shPts[0].t>500)shPts.shift();
  if(shPts.length<6||now-lastShake<1200)return;
  var dist=0,dirs=0;
  for(var i=1;i<shPts.length;i++){
    var dx=shPts[i].x-shPts[i-1].x,dy=shPts[i].y-shPts[i-1].y;
    dist+=Math.sqrt(dx*dx+dy*dy);
    if(i>1){var px=shPts[i-1].x-shPts[i-2].x;if((dx>0&&px<0)||(dx<0&&px>0))dirs++;}
  }
  if(dist>400&&dirs>=3){lastShake=now;scatter();}
});

function scatter(){
  snd();gravOn=false;
  var W=window.innerWidth,H=window.innerHeight,pad=isMob?70:130;
  cards.forEach(function(c){
    if(c.el.style.display==='none')return;
    var nx=pad+Math.random()*Math.max(10,W-c.w-pad*2);
    var ny=pad+Math.random()*Math.max(10,H-c.h-pad*2);
    var nr=(Math.random()-0.5)*22;
    c.x=nx;c.y=ny;c.r=nr;c.vx=0;c.vy=0;
    c.el.style.transition='left .7s cubic-bezier(.22,1,.36,1),top .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)';
    c.el.style.left=nx+'px';c.el.style.top=ny+'px';
    c.el.style.transform='rotate('+nr+'deg)';
    setTimeout(function(){c.el.style.transition='';},750);
  });
  setTimeout(snd,350);
}

/* TABS */
var tabs=document.querySelectorAll('.tb');
for(var t=0;t<tabs.length;t++){
  tabs[t].addEventListener('click',function(){
    var f=this.getAttribute('data-f');
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('on');
    this.classList.add('on');
    snd();
    if(f==='all'){
      document.body.classList.remove('light-mode');
      cards.forEach(function(c){
        c.el.style.display='block';
        c.el.style.transition='opacity .4s ease';
        c.el.style.opacity='1';
        setTimeout(function(){c.el.style.transition='';},400);
      });
      scatter();return;
    }
    if(f==='bp')document.body.classList.add('light-mode');
    else document.body.classList.remove('light-mode');
    var match=[],rest=[];
    cards.forEach(function(c){if(c.project===f)match.push(c);else rest.push(c);});
    rest.forEach(function(c){
      c.el.style.transition='opacity .4s ease,transform .4s ease';
      c.el.style.opacity='0';
      c.el.style.transform='scale(.95) rotate('+c.r+'deg)';
      setTimeout(function(){c.el.style.display='none';c.el.style.transition='';},400);
    });
    var W=window.innerWidth,H=window.innerHeight;
    var cols=Math.ceil(Math.sqrt(match.length*1.3)),gap=isMob?8:14;
    var avgW=0,avgH=0;
    match.forEach(function(c){avgW+=c.w;avgH+=c.h;});
    avgW=avgW/match.length;avgH=avgH/match.length;
    var startX=Math.max(20,(W-cols*(avgW+gap))/2);
    var startY=Math.max(120,(H-Math.ceil(match.length/cols)*(avgH+gap))/2);
    match.forEach(function(c,i){
      var col=i%cols,row=Math.floor(i/cols);
      var nx=startX+col*(avgW+gap)+(Math.random()-0.5)*6;
      var ny=startY+row*(avgH+gap)+(Math.random()-0.5)*6;
      var nr=(Math.random()-0.5)*4;
      c.el.style.display='block';
      c.el.style.transition='left .6s cubic-bezier(.22,1,.36,1),top .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),opacity .4s ease';
      c.el.style.opacity='1';c.el.style.left=nx+'px';c.el.style.top=ny+'px';
      c.el.style.transform='rotate('+nr+'deg)';
      c.x=nx;c.y=ny;c.r=nr;c.vx=0;c.vy=0;
      zTop++;c.el.style.zIndex=zTop;
      setTimeout(function(){c.el.style.transition='';},700);
    });
  });
  tabs[t].addEventListener('dblclick',function(){
    var f=this.getAttribute('data-f');if(f!=='all')openDetail(f);
  });
}

/* TOUCH — DRAG */
var tCard=null,tOff={x:0,y:0},tLast=0,lastTap=0;
canvas.addEventListener('touchstart',function(e){
  if(e.touches.length>1)return;
  var touch=e.touches[0];
  var el=document.elementFromPoint(touch.clientX,touch.clientY);
  var card=el?el.closest('.card'):null;
  if(!card)return;
  var now=Date.now();
  if(now-lastTap<300){openDetail(card.getAttribute('data-project'));lastTap=0;e.preventDefault();return;}
  lastTap=now;
  tCard=cards[card.getAttribute('data-idx')];
  var rect=card.getBoundingClientRect();
  tOff.x=touch.clientX-rect.left;tOff.y=touch.clientY-rect.top;
  tLast=now;zTop++;tCard.el.style.zIndex=zTop;
  tCard.el.classList.add('dr');snd();e.preventDefault();
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  if(!tCard||e.touches.length>1)return;
  var touch=e.touches[0],now=Date.now(),dt=now-tLast;
  var nx=(touch.clientX-tOff.x)/zoom,ny=(touch.clientY-tOff.y)/zoom;
  if(dt>0){tCard.vx=(nx-tCard.x)/dt*16;tCard.vy=(ny-tCard.y)/dt*16;}
  tCard.x=nx;tCard.y=ny;
  tCard.el.style.left=nx+'px';tCard.el.style.top=ny+'px';
  tLast=now;e.preventDefault();
},{passive:false});

canvas.addEventListener('touchend',function(){
  if(!tCard)return;tCard.el.classList.remove('dr');tCard=null;snd();
});

/* TOUCH — PINCH ZOOM */
var pinchD=0;
canvas.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchD=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(pinchD>0){targetZoom=Math.min(2.5,Math.max(0.3,targetZoom*(d/pinchD)));}
    pinchD=d;
  }
},{passive:true});
canvas.addEventListener('touchend',function(e){if(e.touches.length<2)pinchD=0;},{passive:true});

/* DEVICE SHAKE */
if(isMob&&window.DeviceMotionEvent){
  var shLast=0;
  window.addEventListener('devicemotion',function(e){
    var a=e.accelerationIncludingGravity;if(!a)return;
    var f=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
    var now=Date.now();
    if(f>30&&now-shLast>1500){shLast=now;scatter();}
  });
}

/* LOADING — ждём окончания анимации SVG, потом fade out */
setTimeout(function(){
  loadingEl.classList.add('done');
  setTimeout(function(){loadingEl.style.display='none';},800);
},2600);

/* BUILD */
build();
setTimeout(scatter,1200);

var rTimer;
window.addEventListener('resize',function(){
  clearTimeout(rTimer);
  rTimer=setTimeout(function(){build();setTimeout(scatter,100);},300);
});
</script>
</body>
</html>
